plugins {
    id 'com.android.application'
}

android {
    namespace 'org.axon.sakina'
    compileSdk 35

    defaultConfig {
        applicationId 'org.axon.sakina'
        minSdk 23
        targetSdk 35

        versionCode 1
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/sakina_release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
