function AsrHelp() {
  const l = state.data.loc;
  return `<div class="grab"></div>
    <div class="sheet-head"><div><h2>Asr Calculation</h2></div><button class="icon-btn" data-action="close-sheet" aria-label="Close">${Icon('x')}</button></div>
    <div class="help">
    <p class="msg">Asr timing is separate from the calculation method. There are two options.</p>
    <div class="mh"><b>Shafi (Standard)</b><p>Asr begins when the shadow of an object equals its height plus the noon shadow. This gives an earlier Asr time.</p></div>
    <div class="mh"><b>Hanafi</b><p>Asr begins when the shadow of an object is twice its height plus the noon shadow. This gives a later Asr time.</p></div>
    <p class="msg" style="margin-top:14px">In Sakina, you choose your madhab separately from the calculation method. This gives you the correct Asr time regardless of which overall method you use.</p>
    ${l ? `<p class="msg"><b>Auto</b> picks the rule that fits your location. For you it is ${autoAsr(l) === 'hanafi' ? 'Hanafi' : 'Shafi'}.</p>` : ''}
    </div>
    <button class="btn btn-primary" data-action="close-sheet">Got it</button>`;
}

function ImportSheet() {
  const p = state.importPlan;
  if (!p) return '';
  const rng = p.from ? `${fmtCard(fromKey(p.from))} – ${fmtCard(fromKey(p.to))}` : '—';
  const per = PRAYERS.map(x => `<div class="imp-row"><span>${x.name}</span><b>${p.byPrayer[x.id]}</b></div>`).join('');
  const nothing = !p.fresh && !p.startChange;
  const extra = [];
  if (p.skipped) extra.push(`${p.skipped} ${p.skipped === 1 ? 'record' : 'records'} skipped (invalid date).`);
  if (p.future) extra.push(`${p.future} ${p.future === 1 ? 'record' : 'records'} skipped (future date).`);
  return `<div class="grab"></div>
    <div class="sheet-head"><div><p class="eyebrow">${esc(p.label)}</p><h2>Import preview</h2><p class="muted">Check this before you import.</p></div>
      <button class="icon-btn" data-action="close-sheet" aria-label="Close">${Icon('x')}</button></div>
    <div class="imp-grid"><div><b>${p.records}</b><small>Records</small></div><div><b>${p.completed}</b><small>Completed</small></div>
      <div><b>${p.fresh}</b><small>New</small></div><div><b>${p.already}</b><small>Already here</small></div></div>
    <div class="card list">
      <div class="imp-row"><span>Dates</span><b>${rng}</b></div>
      ${p.startChange ? `<div class="imp-row"><span>Tracking starts</span><b>${fmtCard(fromKey(p.startChange))}</b></div>` : ''}
      ${per}
    </div>
    <p class="note">${p.kind === 'deen' ? 'Only prayer records are imported. Ramadan, Quran, Hadith and Dua data in the file are ignored. ' : ''}Nothing is deleted. Prayers already in Sakina stay as they are.${p.startChange ? ' Days in the file with no completed prayer count as missed.' : ''}${extra.length ? ' ' + extra.join(' ') : ''}${nothing ? ' Everything in this file is already in Sakina.' : ''}</p>
    <button class="btn btn-primary" data-action="confirm-import" ${nothing ? 'disabled' : ''}>Import ${p.fresh} ${p.fresh === 1 ? 'prayer' : 'prayers'}</button>
    <button class="btn btn-ghost" data-action="close-sheet">Cancel</button>`;
}

function SheetView() {
  if (!state.sheet) return '';
  const fresh = state.sheetFresh ? ' enter' : '';
  const body = { log: LogSheet, reset: ResetSheet, import: ImportSheet, 'help-method': MethodHelp, 'help-asr': AsrHelp }[state.sheet]();
  return `<div class="backdrop${fresh}" data-action="close-sheet"></div>
    <div class="sheet${fresh}" role="dialog" aria-modal="true" aria-label="${{ log: 'Log prayers', reset: 'Reset all data', import: 'Import preview', 'help-method': 'Calculation methods', 'help-asr': 'Asr calculation' }[state.sheet]}" tabindex="-1">${body}</div>`;
}

function openSheet(type) {
  state.sheet = type; state.sheetFresh = true; state.closing = false;
  render();
  const s = $('.sheet'); if (s) s.focus({ preventScroll: true });
}

function closeSheet() {
  if (!state.sheet || state.closing) return;
  state.closing = true;
  $('#overlay').classList.add('leaving');
  setTimeout(() => {
    state.sheet = null; state.closing = false;
    $('#overlay').classList.remove('leaving');
    render();
  }, 180);
}

/* =====================================================================
   Render
   ===================================================================== */
function render(enter) {
  const v = $('#view');
  v.innerHTML = VIEWS[state.view]();
  if (enter) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  $('#nav').innerHTML = Nav();
  $('#overlay').innerHTML = SheetView();
  tickNext();
  document.body.classList.toggle('lock', !!state.sheet);
  state.sheetFresh = false;
  document.querySelectorAll('[data-ring]').forEach(el => {
    const pct = Number(el.dataset.pct);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const fg = el.querySelector('.ring-fg');
      if (fg) fg.style.strokeDashoffset = RING_C * (1 - pct / 100);
    }));
    ringPrev[el.dataset.ring] = pct;
  });
  const sc = document.querySelector('.hm-scroll');      // current year: end the view at today's week
  if (sc) {
    const cur = state.year === new Date().getFullYear() && sc.querySelector ? sc.querySelector(`[data-key="${todayKey()}"]`) : null;
    sc.scrollLeft = cur ? Math.max(0, cur.getBoundingClientRect().right - sc.getBoundingClientRect().left + sc.scrollLeft - sc.clientWidth + 6) : 0;
  }
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =====================================================================
   Navigation + events
   ===================================================================== */
const parseHash = () => {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  let view = parts[0];
  if (view === 'profile') view = 'settings';              // old name
  if (!VIEWS[view]) return { view: 'home', sub: null };
  return { view, sub: view === 'settings' && SUBS[parts[1]] ? parts[1] : null };
};

function go(view, sub) {
  const target = '#/' + view + (sub ? '/' + sub : '');
  if ((location.hash || '#/home') === target) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  location.hash = target;      // hashchange does the rest, so the back button works
}

window.addEventListener('hashchange', () => {
  const r = parseHash();
  if (r.view === state.view && r.sub === state.sub) return;
  state.view = r.view; state.sub = r.sub;
  state.sheet = null; state.closing = false;
  $('#overlay').classList.remove('leaving');
  render(true);
  window.scrollTo(0, 0);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const d = t.dataset;
  switch (d.action) {
    case 'nav': go(d.to); break;
    case 'mark': mark(d.prayer); break;
    case 'hist-mark': toggle(d.key, d.prayer); render(); break;
    case 'more': state.histLimit += 30; render(); break;
    case 'select-day': state.selected = d.key; render(); break;
    case 'back-today': state.selected = todayKey(); render(); break;
    case 'open-log': openSheet('log'); break;
    case 'close-sheet': closeSheet(); break;
    case 'hm-pick': {
      const c = countDay(d.key), el = $('#hm-detail');
      if (el) el.textContent = `${fmtShort.format(fromKey(d.key))}: ${c.done}/${N} completed` + (c.missed ? ` · ${c.missed} missed` : '');
      break;
    }
    case 'set-week':
      state.data.weekStart = Number(d.ws);
      if (!weekKeys().includes(state.selected)) state.selected = todayKey();
      save(); render(); break;
    case 'open-sub': go('settings', d.sub); break;
    case 'back': go('settings'); break;
    case 'detect': detectLocation(); break;
    case 'manual-toggle': openManual(); render(); break;
    case 'search': searchManual(); break;
    case 'pick-result': pickResult(Number(d.i)); break;
    case 'save-manual': saveManual(); break;
    case 'help': openSheet('help-' + d.topic); break;
    case 'adj': {
      const v = Math.max(-60, Math.min(60, (state.data.adj[d.id] || 0) + Number(d.step)));
      if (v) state.data.adj[d.id] = v; else delete state.data.adj[d.id];
      clearCache(); save(); render(); break;
    }
    case 'adj-reset': state.data.adj = {}; clearCache(); save(); render(); toast('Adjustments cleared'); break;
    case 'set-theme': state.data.theme = d.mode; applyTheme(); save(); render(); break;
    case 'bg-type': state.data.bg.type = d.t; save(); applyBackground(); render(); break;
    case 'bg-dark': state.data.bg.dark = d.d; save(); applyBackground(); render(); break;
    case 'bg-pick': $('#bg-file').click(); break;
    case 'bg-remove':
      bgPhoto = null; try { localStorage.removeItem(PHOTO_KEY); } catch (e) { /* ignore */ }
      state.data.bg.type = 'dots'; save(); applyBackground(); render(); toast('Photo removed'); break;
    case 'confirm-import': {
      const plan = state.importPlan;
      if (!plan) break;
      applyImport(plan);
      state.year = new Date().getFullYear(); state.importPlan = null;
      closeSheet(); toast(`Imported ${plan.fresh} ${plan.fresh === 1 ? 'prayer' : 'prayers'}`); break;
    }
    case 'export': exportData(); break;
    case 'pick-file': $('#import-file').click(); break;
    case 'ask-reset': openSheet('reset'); break;
    case 'confirm-reset':
      state.data = defaults(); state.selected = todayKey(); state.year = new Date().getFullYear(); state.histLimit = 30; clearCache(); resetUi(); bgPhoto = null; try { localStorage.removeItem(PHOTO_KEY); } catch (e) { /* ignore */ } applyTheme(); applyBackground();
      save(); state.sheet = null; state.closing = false;
      $('#overlay').classList.remove('leaving');
      render(); toast('All data cleared'); break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'year-select') { state.year = Number(t.value); render(); }
  else if (t.id === 'range-select') { state.histRange = t.value; state.histLimit = 30; render(); }
  else if (t.id === 'import-file') { handleImport(t.files && t.files[0]); t.value = ''; }
  else if (t.id === 'method-select') { state.data.calc.method = t.value; clearCache(); save(); render(); toast('Calculation method updated'); }
  else if (t.id === 'asr-select') { state.data.calc.asr = t.value; clearCache(); save(); render(); toast('Asr calculation updated'); }
  else if (t.id === 'tz-select') { state.form.tz = t.value; }
  else if (t.id === 'bg-file') { loadPhoto(t.files && t.files[0]); t.value = ''; }
});

document.addEventListener('input', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'name-input') { state.data.name = v.slice(0, 30); save(); $('#avatar').innerHTML = AvatarInner(); }
  else if (id === 'f-q') state.form.q = v;
  else if (id === 'f-name') { state.form.name = v; state.form.meta = null; }
  else if (id === 'f-lat') state.form.lat = v;
  else if (id === 'f-lon') state.form.lon = v;
  else if (id === 'bg-o' || id === 'bg-s') {
    const t = state.data.bg.type;
    if (!BG_LIMITS[t]) return;
    state.data.bg[t][id === 'bg-o' ? 'o' : 's'] = Number(v);
    const out = $('#' + id + '-v');
    if (out) out.textContent = id === 'bg-o' ? v + '%' : v + ' px';
    applyBackground(); saveSoon();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'f-q') { e.preventDefault(); searchManual(); }
});

// Keep "today" correct if the app stays open past midnight.
let knownToday = todayKey();
function checkDate() {
  const t = todayKey();
  if (t === knownToday) return;
  const followed = state.selected === knownToday;
  knownToday = t;
  if (followed || !weekKeys().includes(state.selected)) state.selected = t;
  render();
}
setInterval(checkDate, 30000);
setInterval(tickNext, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDate(); });

/* =====================================================================
   Start
   ===================================================================== */
{ const r = parseHash(); state.view = r.view; state.sub = r.sub; }
applyTheme();
applyBackground();
render(true);
})();
</script>
</body>
</html>
